<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QX Signal Pro - Quotex Trading</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Noto Sans Tamil', sans-serif;
      background-color: #070b14;
      color: #f8fafc;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }
  </style>
</head>
<body class="min-h-screen bg-[#070b14] text-slate-100 pb-10">
  <div class="max-w-3xl mx-auto px-4 pt-5 space-y-4">

    <!-- Header & IST Clock -->
    <header class="glass-card rounded-2xl p-4 space-y-4 shadow-xl">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-xl bg-emerald-500/20 border border-emerald-400/40 flex items-center justify-center text-emerald-400 font-extrabold text-lg">
            QX
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-lg font-bold text-white">QX Signal Pro</h1>
              <span class="px-2 py-0.5 text-[11px] font-semibold rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                AI V4.2
              </span>
            </div>
            <p class="text-xs text-slate-400">Quotex Live &amp; OTC Technical Signal Engine</p>
          </div>
        </div>

        <div class="bg-slate-900 border border-slate-700/80 rounded-xl px-4 py-2 text-right">
          <div class="text-[10px] uppercase tracking-wider text-slate-400">IST (INDIA)</div>
          <div id="liveIstClock" class="font-mono font-bold text-emerald-300 text-base">00:00:00</div>
        </div>
      </div>

      <!-- Controls: Pair, Timeframe, Generate -->
      <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-800">
        <button id="openPairModalBtn" type="button" class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-sm font-semibold text-white">
          <span id="activePairLabel">EUR/USD (OTC)</span>
          <span class="text-xs text-emerald-400">&#9662; Pair</span>
        </button>

        <div class="flex items-center gap-2">
          <div class="inline-flex rounded-xl bg-slate-900 p-1 border border-slate-800">
            <button id="tf1mBtn" type="button" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-500 text-slate-950">
              1m
            </button>
            <button id="tf5mBtn" type="button" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:text-white">
              5m
            </button>
          </div>

          <button id="generateSignalBtn" type="button" class="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-bold text-xs sm:text-sm transition">
            Generate Signal
          </button>
        </div>
      </div>
    </header>

    <!-- Active Signal Card -->
    <section class="glass-card rounded-2xl p-5 space-y-4 shadow-xl">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">ACTIVE SIGNAL</div>
          <div id="signalDirectionText" class="text-2xl sm:text-3xl font-extrabold text-rose-400 mt-0.5">
            PUT (DOWN)
          </div>
          <div id="signalSubtext" class="text-xs text-slate-300 mt-1">
            கீழே செல்ல
